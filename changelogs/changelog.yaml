ancestor: null
releases:
  1.0.0:
    changes:
      release_summary: This is the major release of the ``ansible.hub`` collection.
    fragments:
    - release.yml
    release_date: '2024-09-23'
  1.0.1:
    changes:
      minor_changes:
      - added additional options for authentication to match controller credential
        type updates.
    fragments:
    - argument_vars.yml
    release_date: '2025-08-18'
  1.0.2:
    changes:
      bugfixes:
      - Fixed an issue where an incompatibility message was indicating the incorrect
        version.
    fragments:
    - fix-error-msg.yml
    release_date: '2025-09-17'
  1.0.3:
    changes:
      bugfixes:
      - Fixed an issue where an incompatibility message was too restrictive.
    fragments:
    - fix-error.msg.yml
    release_date: '2025-10-22'
  1.0.4:
    changes:
      major_changes:
      - Added ah_team and team_roles modules to manage assigning roles to teams in
        AAP 2.6. The team_roles module will only work in galaxy_ng 4.11+ and AAP 2.6+.
        The ah_team module will only work in galaxy_ng 4.11+ and added to support
        testing the team_roles module.
    fragments:
    - team_modules_added.yml
    release_date: '2026-02-05'
  1.0.5:
    changes:
      bugfixes:
      - Fixed group_roles module failing with HTTP 400 when assigning namespace-scoped
        execution environment roles such as galaxy.execution_environment_collaborator.
    fragments:
    - fix-group-roles-ee-namespace.yml
    release_date: '2026-03-12'
  1.0.6:
    changes:
      deprecated_features:
      - ah_token - module now emits a deprecation warning when used with AAP 2.5 or
        2.6 (Hub 4.10/4.11) and fails with a clear error on AAP 2.7+ (Hub 4.12+).
        This module is not compatible with Gateway-only authentication in AAP 2.7.
        Use the ansible.platform collection for token management instead.
      - ah_user - module now emits a deprecation warning when used with AAP 2.5 or
        2.6 (Hub 4.10/4.11) and fails with a clear error on AAP 2.7+ (Hub 4.12+).
        This module is not compatible with Gateway-only user management in AAP 2.7.
        Use the ansible.platform collection or AAP Gateway UI to manage users instead.
    fragments:
    - deprecate-ah-token-ah-user.yml
    release_date: '2026-03-19'
  1.0.7:
    changes:
      bugfixes:
      - ah_token - Send authentication headers in check_deprecation() version-check
        requests so deprecation warnings and version gates work correctly when galaxy_ng
        strips version fields from unauthenticated API root responses (https://redhat.atlassian.net/browse/AAP-68691).
    fragments:
    - fix-ah-token-auth-deprecation-check.yml
    release_date: '2026-06-18'
  1.1.0:
    changes:
      minor_changes:
      - The minimum supported ansible-core version is now 2.16. ansible-core 2.15
        is no longer supported (https://forum.ansible.com/t/red-hat-ansible-automation-platform-is-ending-support-for-ansible-core-2-15-and-python-3-11/45574).
    fragments:
    - bump-ansible-core-2.16.yml
    release_date: '2026-06-26'
  1.1.1:
    changes:
      bugfixes:
      - Prevent credentials marked ``no_log`` from appearing in unrecognized API error
        responses (https://redhat.atlassian.net/browse/AAP-90033).
      - Surface the real API error message when an HTTP error response body does not
        match one of the previously recognized shapes, instead of a generic and unhelpful
        error (https://redhat.atlassian.net/browse/AAP-90033).
      - ah_collection - Fix version extraction from collection tarball paths containing
        hyphens in directory components (https://github.com/ansible-collections/ansible_hub/issues/59).
      - 'ah_ee_repository - Fix ``Update error: Failed to read response body: ''dict''
        object has no attribute ''read''`` when updating an existing execution environment
        repository, by sending updates as a partial update (PATCH) instead of a full
        replace (PUT) (https://redhat.atlassian.net/browse/AAP-90033).'
      - ah_ee_repository - Setting ``description`` to an empty string to clear it
        no longer fails with ``This field may not be blank.``; it is now sent to the
        API as a null value, which the server accepts (https://redhat.atlassian.net/browse/AAP-90033).
    fragments:
    - fix-ee-repository-update-error-handling.yml
    - fix-version-extraction-hyphen-path.yml
    release_date: '2026-09-02'
