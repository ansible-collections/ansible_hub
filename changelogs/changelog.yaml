ancestor: null
releases:
  1.0.0:
    changes:
      release_summary: This is the major release of the ``ansible.hub`` collection.
    fragments:
    - release.yml
    release_date: '2024-09-23'
  1.0.1:
    changes:
      minor_changes:
      - added additional options for authentication to match controller credential
        type updates.
    fragments:
    - argument_vars.yml
    release_date: '2025-08-18'
  1.0.2:
    changes:
      bugfixes:
      - Fixed an issue where an incompatibility message was indicating the incorrect
        version.
    fragments:
    - fix-error-msg.yml
    release_date: '2025-09-17'
  1.0.3:
    changes:
      bugfixes:
      - Fixed an issue where an incompatibility message was too restrictive.
    fragments:
    - fix-error.msg.yml
    release_date: '2025-10-22'
  1.0.4:
    changes:
      major_changes:
      - Added ah_team and team_roles modules to manage assigning roles to teams in
        AAP 2.6. The team_roles module will only work in galaxy_ng 4.11+ and AAP 2.6+.
        The ah_team module will only work in galaxy_ng 4.11+ and added to support
        testing the team_roles module.
    fragments:
    - team_modules_added.yml
    release_date: '2026-02-05'
